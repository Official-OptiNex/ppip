# Deploys to Cloudflare (free plan) on every push to main, and builds the USB version.
# Needs repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional repo variable: PPIP_SERVER_URL (e.g. https://ppip.yourname.workers.dev) for the USB build.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build USB version
        run: npm run build:usb
        env:
          PPIP_SERVER_URL: ${{ vars.PPIP_SERVER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: Process-Engineer-USB
          path: dist/usb/
          include-hidden-files: false
          retention-days: 90
