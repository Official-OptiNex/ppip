<!doctype html>
<html lang="en" data-theme="dark" data-size="standard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c121b" />
    <meta name="description" content="Parts, stock alerts, order guides, PMs, knives &amp; rollers, downtime and shift notes for the maintenance team." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Process Technician" />
    <meta name="application-name" content="Process Technician" />
    <title>Process Technician</title>
    <script>
      // Apply saved theme/text size before first paint (no flash).
      try {
        var p = JSON.parse(localStorage.getItem('ppip.prefs') || '{}');
        var d = p.theme !== 'light' && (p.theme !== 'system' || matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.dataset.size = p.textSize || 'standard';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
